# ============================================
# Docker Compose 基础配置
# APP_ENV_FILE 指向服务端环境文件，默认使用 server/.env.production。
# ============================================

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-wallpaper_site}
      MYSQL_USER: ${DB_USERNAME:-wallpaper}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max-connections=150",
        "--performance-schema=OFF",
      ]
    # 宿主机端口默认 3306，与本地 .env.development 的 DB_PORT 一致。
    # 若本机已有 MySQL 占用 3306，启动时设 DB_HOST_PORT=3307 并同步改 DB_PORT。
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-server/.env.production}
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ""
      TYPEORM_MIGRATIONS_RUN: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  server_uploads:
