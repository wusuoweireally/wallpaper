# 本地只起库：pnpm db:up          （仅 mysql）
# 生产全栈：  pnpm deploy         （mysql + profile app）
#
# server 容器固定读 server/.env.production；compose 插值用 --env-file，二者同一文件：
#   docker compose --env-file server/.env.production --profile app up -d --build
# 镜像统一由根 Dockerfile 多阶段构建，server / web 为其中的两个 target。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # json-file 默认无上限会撑爆磁盘，三服务统一轮转（50m x 5）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-wallpaper_site}
      MYSQL_USER: ${DB_USERNAME:-wallpaper}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max-connections=150",
        "--performance-schema=OFF",
      ]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 带凭据探测，避免初始化阶段（临时实例）误报健康导致 server 过早连库
      # start_period 覆盖首次冷启动 datadir 初始化（慢盘大卷可能 >1 分钟），期间失败不计入 retries
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    # 优雅停机窗口：配合 server 的 enableShutdownHooks 等在途请求收尾（默认 10s 偏短）
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - server/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: "3306"
      TYPEORM_MIGRATIONS_RUN: "true"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Node 22 自带 fetch，免装 curl；探测无鉴权公开接口 /tags
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/tags').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      # nginx 反代只需 server DNS 存在，无需等健康；串行等待会拖慢冷启动
      - server
    ports:
      - "127.0.0.1:3001:80"

volumes:
  mysql_data:
