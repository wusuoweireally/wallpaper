# ============================================
# Docker Compose 配置（开发/生产通用）
#
# 开发环境: docker compose up -d
# 生产环境: docker compose up -d --build
# ============================================

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      # 从 server/.env.xxx 读取密码
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-wallpaper_site}
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max-connections=150",
        "--performance-schema=OFF",
      ]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    # 本地开发用 .env.local，线上部署用 .env.production
    # 线上部署命令：docker compose --env-file server/.env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
    env_file:
      - server/.env.local
    environment:
      TYPEORM_MIGRATIONS_RUN: "true"
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  server_uploads:
