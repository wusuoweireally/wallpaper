# 本地只起库：pnpm db:up          （仅 mysql）
# 生产全栈：  pnpm deploy         （mysql + profile app）
#
# server 容器固定读 server/.env.production；compose 插值用命令行 --env-file。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-wallpaper_site}
      MYSQL_USER: ${DB_USERNAME:-wallpaper}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max-connections=150",
        "--performance-schema=OFF",
      ]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    profiles: ["app"]
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - server/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: "3306"
      TYPEORM_MIGRATIONS_RUN: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:80"

volumes:
  mysql_data:
  server_uploads:
