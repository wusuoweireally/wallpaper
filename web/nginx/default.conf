# 容器内 Nginx：HTTP only，TLS 由宿主机反代
# 透传上游（宿主机 TLS 反代）的协议头，未携带时兜底为容器内的 http；
# 直接写 $scheme 会把 https 无条件覆盖成 http，导致后端 Cookie Secure 自动探测误判
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 52m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1000;

  root /usr/share/nginx/html;
  index index.html;

  # 反代公共配置（location 内无 proxy_set_header 时继承自此）
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }

  # 剥掉 /api 前缀再转给 Nest（Nest 无 globalPrefix）
  location ^~ /api/ {
    proxy_pass http://server:3000/;
  }

  location = /api {
    return 301 /api/;
  }
}
