# 容器内 Nginx：HTTP only，TLS 由宿主机反代
# 透传上游（宿主机 TLS 反代）的协议头，未携带时兜底为容器内的 http；
# 直接写 $scheme 会把 https 无条件覆盖成 http，导致后端 Cookie Secure 自动探测误判
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 52m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1000;

  root /usr/share/nginx/html;
  index index.html;

  # 反代公共配置（location 内无 proxy_set_header 时继承自此）
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  # 安全响应头。nginx 规则：location 内出现任何 add_header 就不再继承 server 级
  # add_header，因此每个带 Cache-Control 的 location 必须重复这一组。
  # script-src 允许 'self' + index.html 里手写的防闪白主题引导脚本（内容稳定，
  # 按 SRI sha256 放行）；改动该内联脚本后需同步更新此哈希，否则首屏脚本被拦。

  # 哈希资产（Vite /assets/*：文件名含内容 hash）：可永久缓存
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # 非哈希公共资源（favicon、默认头像等）：短缓存保证可更新
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # SPA 入口与前端路由：禁强缓存，部署后立即拿到新入口（避免拿旧
  # index.html 去请求已被清理的旧 hash 资产而白屏）
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-iu8jTlaYyGiruzFThvPmZyVaCCM/4CgCsj6Zt7UILXM='; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    try_files $uri /index.html;
  }

  # 剥掉 /api 前缀再转给 Nest（Nest 无 globalPrefix）
  # 上传壁纸需 COS 分片上传+内容审核，耗时可达数分钟，放宽读写超时
  location ^~ /api/ {
    proxy_pass http://server:3000/;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /api {
    return 301 /api/;
  }
}
