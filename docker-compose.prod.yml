# ============================================
# Docker Compose - 生产环境
# 用法: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# ============================================

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wallpaper_site
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--max-connections=500",
      ]
    ports:
      - "127.0.0.1:3306:3306"  # 只绑定本地，不暴露到公网
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - server/.env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - server_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 如果有 SSL 证书，挂载到这里
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_prod_data:
  server_uploads:
