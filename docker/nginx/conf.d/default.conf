# ============================================
# Nginx 配置（Docker 容器内使用）
# ============================================

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

# HTTP → HTTPS 重定向
server {
  listen 80;
  server_name rain-gem.top;

  # 上传大小限制
  client_max_body_size 50m;

  # 所有 HTTP 请求重定向到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }

  # Let's Encrypt 验证（保留 HTTP 用于续期）
  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }
}

# HTTPS 服务
server {
  listen 443 ssl http2 default_server;
  server_name rain-gem.top;

  # SSL 证书
  ssl_certificate /etc/nginx/ssl/wallpaper.crt;
  ssl_certificate_key /etc/nginx/ssl/wallpaper.key;

  # SSL 优化
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # 上传大小限制
  client_max_body_size 50m;

  # Gzip 压缩
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1000;

  root /usr/share/nginx/html;
  index index.html;

  # 安全头
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # 静态资源缓存
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # API proxy（去掉 /api 前缀）
  # ^~ 确保优先级高于正则 location，避免图片等静态资源被拦截
  location ^~ /api/ {
    proxy_pass http://server:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }

  location ^~ /api {
    return 301 /api/;
  }

  # 上传文件代理（^~ 确保高于正则 location 优先级）
  location ^~ /uploads/ {
    proxy_pass http://server:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
  }
}
