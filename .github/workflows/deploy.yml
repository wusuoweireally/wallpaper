# CI/CD 流水线：push main → 门禁检查 → SSH 部署到生产
# 部署脚本与 AGENTS.md「生产部署」标准流程保持一致（服务器端构建，非镜像推送）
# 所需 Secrets（Settings → Secrets and variables → Actions）：
#   SERVER_HOST     生产服务器 IP
#   DEPLOY_SSH_KEY  专用部署私钥（authorized_keys 中备注 github-actions-deploy）
name: deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    name: 门禁（type-check + lint + test + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本自动读取根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      # web 测试脚本依赖 --experimental-strip-types（Node >= 22.6），CI 固定 Node 22 满足
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: 部署生产
    needs: ci # 门禁全绿才部署
    runs-on: ubuntu-latest
    steps:
      - name: SSH 拉代码并重建容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # 有命令失败立即退出，否则 action 恒显示成功（假绿）
            set -e
            cd ~/code/wallpaper
            git pull --ff-only
            # 必须用 run：裸 pnpm deploy 会命中 pnpm 内置 deploy 命令
            pnpm run deploy
            docker compose --env-file server/.env.production --profile app ps
